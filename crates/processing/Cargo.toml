[package]
name = "fixpunkt-processing"
version.workspace = true
edition.workspace = true
description = "Fixpunkt-Engine: Punktwolken einlesen, DGM rastern, Volumen (Aushub, Haufwerk) berechnen"
license.workspace = true
publish = false

[lib]
name = "fixpunkt"
path = "src/lib.rs"

[[bin]]
name = "fixpunkt-engine"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
las = { version = "0.11", features = ["laz"] }
nalgebra = "0.35.0"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.11.3"
