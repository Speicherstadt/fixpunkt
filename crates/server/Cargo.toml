[package]
name = "fixpunkt-server"
description = "Fixpunkt-Server: API, Jobs und eingebettete Web-UI in einer Programmdatei"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "fixpunkt_server"
path = "src/lib.rs"

[[bin]]
name = "fixpunkt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
fixpunkt-processing = { path = "../processing" }
futures = "0.3.34"
hex = "0.4.3"
mime_guess = "2.0.5"
rand = "0.10"
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }

# Der Allokator von musl ist bei vielen Threads langsam (Rechenkern mit rayon); die statischen
# Programmdateien des Releases nehmen deshalb mimalloc
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }
