# Markdown-Erweiterung für die Doku (mkdocs.yml, markdown_extensions): deutsche Titel der Hinweiskästen.
# Wird über requirements-docs.txt mit installiert, damit `zensical build` und `zensical serve` sie finden.
[project]
name = "fixpunkt-doku-hinweise"
version = "0.1.0"
description = "Deutsche Titel für Hinweise im GitHub-Stil in der Doku von Fixpunkt (Zensical)"
requires-python = ">=3.11"
dependencies = ["markdown"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["fixpunkt_doku_hinweise.py"]
